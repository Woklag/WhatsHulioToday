<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юля сегодня...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .word {
            font-weight: bold;
            color: #007bff;
            word-wrap: break-word;
        }
        /* Стили для кнопки тестирования (можно убрать потом) */
        .debug-btn {
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #555;
            transition: background 0.2s;
        }
        .debug-btn:hover {
            background-color: #d0d0d0;
        }
        .loading {
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="content">Юля сегодня <span class="loading">загружает...</span></h1>
    
    <!-- Кнопка для принудительного обновления (осталась для тестов) -->
    <button class="debug-btn" onclick="loadWord()">Обновить слово</button>
</div>

<script>
    // ЗАМЕНИ ЭТУ ССЫЛКУ НА АДРЕС ТВОЕГО CLOUDFLARE WORKER
    // Например: https://my-worker.username.workers.dev
    const WORKER_URL = 'https://YOUR-WORKER-URL.workers.dev'; 

    async function loadWord() {
        const contentElement = document.getElementById('content');
        
        // Показываем состояние загрузки
        contentElement.innerHTML = 'Юля сегодня <span class="loading">загружает...</span>';

        try {
            // Делаем запрос к Cloudflare Worker
            const response = await fetch(WORKER_URL);
            
            if (!response.ok) {
                throw new Error('Ошибка сети');
            }

            // Получаем текст (слово) от воркера
            const word = await response.text();

            // Если воркер вернул пустоту или ошибку внутри текста (на всякий случай)
            if (!word || word.trim() === '') {
                contentElement.innerHTML = 'Юля сегодня <span class="word">...</span>';
            } else {
                // Вставляем полученное слово
                contentElement.innerHTML = `Юля сегодня <span class="word">${word}</span>`;
            }

        } catch (error) {
            console.error('Ошибка получения слова:', error);
            // В случае любой ошибки показываем "..." как договаривались
            contentElement.innerHTML = 'Юля сегодня <span class="word">...</span>';
        }
    }

    // Запускаем загрузку при открытии страницы
    loadWord();
</script>

</body>
</html>

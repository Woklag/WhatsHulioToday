<!DOCTYPE html>
<html lang="ru"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юля сегодня</title>
    <style>
        body {
            margin: 0;
            padding: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: black;
        }
        #word-display {
            font-size: 1.5rem;
            font-weight: normal;
            white-space: nowrap;
        }
        .loading-text::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="word-display"><span class="loading-text">Юля сегодня</span></div>
    <script>
        const WORKER_URL = 'https://yulia-word.ratcatsnack.workers.dev';
        const wordDisplay = document.getElementById('word-display');
        
        async function fetchWord() {
            try {
                const response = await fetch(WORKER_URL + '?t=' + Date.now(), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.word && data.word !== '...' && data.word !== 'Ошибка') {
                    wordDisplay.innerHTML = 'Юля сегодня ' + data.word;
                } else {
                    throw new Error('Получено некорректное слово: ' + data.word);
                }
            } catch (error) {
                console.error('Ошибка при получении слова:', error);
                wordDisplay.textContent = 'Ошибка сети';
            }
        }
        
        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            fetchWord();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юля сегодня</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 20px;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #4a4a4a;
        }
        #word-display {
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b6b;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-wrap: break-word;
        }
        .loading {
            font-size: 1.5rem;
            color: #888;
        }
        .error {
            color: #888;
            font-style: italic;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Юля сегодня <span id="word-display" class="loading">...</span></h1>
    <!-- Кнопка для тестирования, можно убрать потом -->
    <button onclick="fetchWord()">Обновить слово</button>
</div>

<script>
    // ЗАМЕНИ ЭТУ ССЫЛКУ НА АДРЕС ТВОЕГО CLOUDFLARE WORKER
    const WORKER_URL = 'yulia-word.ratcatsnack.workers.dev'; 

    async function fetchWord() {
        const displayElement = document.getElementById('word-display');
        displayElement.textContent = '...';
        displayElement.className = 'loading';

        try {
            const response = await fetch(WORKER_URL);
            
            if (!response.ok) {
                throw new Error('Ошибка сети');
            }

            // Важно: парсим ответ как JSON
            const data = await response.json();
            
            // Берем только поле word из ответа {"word": "...", "date": "..."}
            if (data && data.word) {
                displayElement.textContent = data.word;
                displayElement.className = '';
            } else {
                throw new Error('Неверный формат данных');
            }

        } catch (error) {
            console.error('Ошибка при получении слова:', error);
            displayElement.textContent = '...';
            displayElement.className = 'error';
        }
    }

    // Загружаем слово при открытии страницы
    fetchWord();
</script>

</body>
</html>

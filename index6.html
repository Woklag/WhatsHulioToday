<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>бля, сёдня...</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: black;
            overflow: hidden;
            transition: background 0.5s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            z-index: 100;
        }

        #start-btn {
            background: none;
            border: none;
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            color: black;
            cursor: pointer;
            animation: flicker 1.5s infinite;
            outline: none;
            padding: 0;
            margin: 0;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #word-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding-left: 5px;
            padding-right: 5px;
            background-color: white;
            color: black;
            font-size: 1.5rem;
            font-weight: normal;
            display: none;
            z-index: 50;
        }

        .loading-text::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <button id="start-btn" type="button">узнай</button>
    </div>

    <div id="word-display">
        <span class="loading-text">юля сегодня</span>
    </div>

    <script>
        const WORKER_URL = 'https://yulia-word.ratcatsnack.workers.dev';
        const wordDisplay = document.getElementById('word-display');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        
        let soundUrl = null;
        let isDataLoaded = false;
        let isStartClicked = false;
        
        // Создаем Promise, который разрешится, когда данные (слово и картинка) будут готовы
        let resolveDataReady;
        const dataReadyPromise = new Promise(resolve => {
            resolveDataReady = resolve;
        });

        function showMainScreen() {
            startScreen.style.display = 'none';
            wordDisplay.style.display = 'block';
        }

        async function fetchWord() {
            try {
                const response = await fetch(WORKER_URL + '?t=' + Date.now(), {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.word && data.word !== '...' && data.word !== 'Ошибка') {
                    const cleanWord = data.word.toLowerCase().replace(/\s*[\(\[\{].*$|,.*/, '');
                    
                    if (data.sound) {
                        soundUrl = data.sound;
                    }
                    
                    const applyData = () => {
                        isDataLoaded = true;
                        wordDisplay.innerHTML = 'юля сегодня ' + cleanWord;
                        if (isStartClicked) {
                            showMainScreen();
                        }
                        // Сообщаем, что данные полностью загружены (включая картинку)
                        if (resolveDataReady) {
                            resolveDataReady();
                            resolveDataReady = null;
                        }
                    };

                    if (data.image) {
                        const img = new Image();
                        img.onload = () => {
                            document.body.style.backgroundImage = `url('${data.image}')`;
                            applyData();
                        };
                        img.onerror = () => {
                            // Даже если картинка не загрузилась, показываем текст и разрешаем промис
                            applyData();
                        };
                        img.src = data.image;
                    } else {
                        applyData();
                    }
                } else {
                    throw new Error('Получено некорректное слово: ' + data.word);
                }
            } catch (error) {
                console.error('Ошибка при получении слова:', error);
                isDataLoaded = true;
                wordDisplay.textContent = 'включи впн...';
                document.body.style.background = 'linear-gradient(to bottom, white 33.33%, blue 33.33%, blue 66.66%, red 66.66%)';
                if (isStartClicked) {
                    showMainScreen();
                }
                // Даже при ошибке разрешаем промис, чтобы музыка могла заиграть на экране ошибки
                if (resolveDataReady) {
                    resolveDataReady();
                    resolveDataReady = null;
                }
            }
        }
        
        startBtn.addEventListener('click', async () => {
            isStartClicked = true;
            showMainScreen(); 
            
            // Ждем, пока данные (слово и картинка) будут полностью загружены
            await dataReadyPromise;
            
            // И только после этого запускаем музыку
            if (typeof window.playSoundtrack === 'function') {
                await window.playSoundtrack();
            }
        });
        
        document.addEventListener('click', (e) => {
            if (e.target === startBtn) return;

            if (soundUrl) {
                const audio = new Audio(soundUrl);
                audio.volume = 0.5;
                audio.play().catch(e => console.log('Autoplay prevented:', e));
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            fetchWord();
        });
    </script>
    
    <script src="soundtrack.js"></script>
</body>
</html>
